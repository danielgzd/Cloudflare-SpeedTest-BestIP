name: CF IP Optimizer

on:
  schedule:
    - cron: '0 20 * * *'   # 每天北京时间凌晨 04:00 运行
  workflow_dispatch:        # 支持手动触发测速

permissions:
  contents: write           # 必须具备写入权限以更新文件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use preinstalled Python (standard library only)
        shell: bash
        run: |
          python3 --version
          mkdir -p "$RUNNER_TEMP/python-bin"
          ln -sf "$(command -v python3)" "$RUNNER_TEMP/python-bin/python"
          echo "$RUNNER_TEMP/python-bin" >> "$GITHUB_PATH"

      - name: Identify pinned speed-test version
        id: cfst-version
        run: |
          python3 - <<'PYTHON'
          import ast, os
          tree = ast.parse(open('scripts/run_speedtest.py').read())
          version = next(ast.literal_eval(node.value) for node in tree.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == 'RELEASE_VERSION' for t in node.targets))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              print('version=' + version, file=stream)
          PYTHON
      - name: Restore speed-test download
        uses: actions/cache@v4
        with:
          path: |
            .tmp_cfst/*.tar.gz
            .tmp_cfst/*.zip
          key: cfst-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cfst-version.outputs.version }}-end

      - name: Run Cloudflare SpeedTest
        env:
          MAX_PER_REGION: "50"        # 每个地区最多选择的IP数量（增加美国IP的选择数量）
          MAX_TOTAL: "100"            # 总共最多选择的IP数量
          PRIORITY_REGIONS: "US,GB,IN,JP,KR,SG,HK"  # 优先处理的地区
          CFST_ARGS: "-n 200 -t 4 -dt 8 -p 0 -o result.csv" # 测速参数
        run: |
          if [ -f scripts/run_speedtest.py ]; then
            python3 scripts/run_speedtest.py
          fi

      - name: Commit & Push
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add best_ip.txt result.csv
            git commit -m "chore: update best ip $(date -u +%F)"
            git push
          else
            echo "No changes detected."
          fi
